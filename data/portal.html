  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>WiFi Setup Portal</title>
  <style>
    body { font-family: Arial, sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
    .box { max-width: 350px; margin: 30px auto; background: #222; padding: 20px; border-radius: 12px; border: 1px solid #333; }
    h2 { color: #00adb5; margin-top: 0; }
    input { display: block; width: 85%; max-width: 300px; margin: 15px auto; padding: 12px; background: #111; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px; }
    input:focus { border-color: #00adb5; outline: none; }
    button { background: #00adb5; color: #fff; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; width: 92%; }
    button:active { background: #008c9e; }
  </style>
</head>
<body>
  <div class="box">
    <h2>WiFi Setup Portal</h2>
    <form action="/savewifi" method="GET">
      <input type="text" name="s" placeholder="WiFi SSID" required>
      <input type="password" name="p" placeholder="WiFi Password">
      <button type="submit">SAVE AND CONNECT</button>
    </form>
  </div>
</body>
